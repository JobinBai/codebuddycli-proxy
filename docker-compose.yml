services:
  codebuddycli-proxy:
    image: jobinbai/codebuddycli-proxy:latest
    restart: unless-stopped
    ports:
      - "${HOST_PORT:-8787}:8787"
    environment:
      CODEBUDDY_API_KEY: "${CODEBUDDY_API_KEY:?Set CODEBUDDY_API_KEY in .env}"
      CODEBUDDY_BASE_URL: "${CODEBUDDY_BASE_URL:-https://copilot.tencent.com/v2}"
      PROXY_API_KEY: "${PROXY_API_KEY:-}"
      DEFAULT_MODEL: "${DEFAULT_MODEL:-hy3}"
      REQUEST_TIMEOUT_MS: "${REQUEST_TIMEOUT_MS:-600000}"
      SESSION_TTL_MS: "${SESSION_TTL_MS:-1800000}"
    volumes:
      - codebuddy-workspace:/app/workspace
    healthcheck:
      test:
        - CMD
        - node
        - -e
        - "fetch('http://127.0.0.1:8787/health').then((response) => process.exit(response.ok ? 0 : 1)).catch(() => process.exit(1))"
      interval: 30s
      timeout: 5s
      retries: 3
      start_period: 60s

volumes:
  codebuddy-workspace:
